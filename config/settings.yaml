# Tunable settings for the RAG app. Change values here, not in the code.

retrieval:
  final_k: 10                # chunks sent to the LLM (shared between the companies in the question)

llm:
  provider: cohere           # "cohere" (hosted, seconds per answer) or "ollama" (local, slow on CPU)
  cohere_model: command-a-03-2025
  temperature: 0
  model: llama3.1            # used when provider is ollama
  num_ctx: 16384             # ollama context window; 10 chunks x ~1000 tokens needs > 8k

enforcement:
  min_relevance: 0.10        # chunks the reranker scores below this are not used as evidence
  max_removed_fraction: 0.5  # refuse if more than this share of claims fail their citation checks

messages:
  refusal_no_evidence: "I can't answer this: none of the documents contain passages relevant to the question."
  refusal_failed_checks: "I can't give a reliable answer: most claims in the generated answer failed citation checks."
  no_info: "No relevant information found in the provided excerpts"
  section_empty: "No supported information remained for this company after citation checks."


evaluation:
  pause_seconds: 7           # wait between questions, to stay under API calls-per-minute limits
  judge:                     # LLM that RAGAS uses to judge faithfulness (any OpenAI-compatible API)
    model: command-a-03-2025
    base_url: https://api.cohere.ai/compatibility/v1
    api_key_env: COHERE_API_KEY

  ci:                        # subset run on every pull request (python evaluation/evaluate.py --ci --check)
    question_ids: [q001, q003, q005, q008, q009, q011, q013, q015, q017, q020, q021, q024, q025, q028, q029,
                   m001, m002, m003, u001, u002, u003]
    thresholds:              # the build fails if any of these is not met
      min_faithfulness: 0.90       # subset baseline: 0.964
      min_answer_rate: 0.90        # subset baseline: 1.0 (18 of 18)
      min_refusal_accuracy: 1.0    # subset baseline: 1.0 (3 of 3)
      max_unscored: 0              # answers the judge failed to score