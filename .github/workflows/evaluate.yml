# Runs the RAG evaluation on every pull request and fails the build if quality drops
# below the thresholds in config/settings.yaml (evaluation.ci.thresholds).
name: RAG evaluation

on:
  pull_request:
  workflow_dispatch:            # also lets you start it by hand from the Actions tab

# A new push to the same PR cancels the run still going, so API calls are not wasted
concurrency:
  group: evaluate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      RERANKER: cohere
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, to see which files the PR changes

      # Skip the evaluation when the PR cannot change answer quality (README, UI, highlighting).
      # The job still reports success, so a required "evaluate" check never stays pending.
      - name: Check whether the PR changes answer quality
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"; echo "$CHANGED"
          # Files that do NOT affect answers; anything else triggers the evaluation
          RELEVANT=$(echo "$CHANGED" | grep -v -E '(\.md$|^LICENSE$|^ui\.py$|^src/highlight\.py$|^\.gitignore$)' || true)
          if [ -n "$RELEVANT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/UI files changed: skipping the evaluation." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Two Pythons, as on your laptop: one for the pipeline, 3.12 for RAGAS
      - name: Set up Python 3.12 (scoring)
        if: steps.changes.outputs.run == 'true'
        id: py_eval
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python 3.14 (pipeline)
        if: steps.changes.outputs.run == 'true'
        id: py_app
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Reuse the installed environments until a requirements file changes (saves several minutes)
      - name: Restore installed packages
        if: steps.changes.outputs.run == 'true'
        id: venvs
        uses: actions/cache@v4
        with:
          path: |
            .venv-app
            .venv-eval
          key: venvs-${{ runner.os }}-${{ steps.py_app.outputs.python-version }}-${{ steps.py_eval.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-eval.txt') }}

      - name: Install packages (only when requirements changed)
        if: steps.changes.outputs.run == 'true' && steps.venvs.outputs.cache-hit != 'true'
        run: |
          ${{ steps.py_app.outputs.python-path }} -m venv .venv-app
          # CPU-only PyTorch: the CI machine has no GPU and this is a much smaller download
          .venv-app/bin/python -m pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          ${{ steps.py_eval.outputs.python-path }} -m venv .venv-eval
          .venv-eval/bin/python -m pip install -r requirements-eval.txt

      - name: Cache the embedding model
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('src/retrieval/hybrid_search.py') }}

      - name: Download the evaluation data from S3
        if: steps.changes.outputs.run == 'true'
        run: |
          aws s3 cp "s3://${S3_BUCKET_NAME}/ci/ci_data.zip" ci_data.zip
          unzip -q ci_data.zip
          ls data

      - name: Generate answers for the CI questions
        if: steps.changes.outputs.run == 'true'
        run: .venv-app/bin/python evaluation/evaluate.py --ci --stage answers

      - name: Score answers and check thresholds
        if: steps.changes.outputs.run == 'true'
        env:
          EVAL_PAUSE_SECONDS: "2"   # scoring makes only chat calls, which allow 20 per minute
        run: .venv-eval/bin/python evaluation/evaluate.py --ci --stage score --check

      - name: Add the scores to the run summary
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          if [ -f evaluation/results/ci/summary.json ]; then
            echo '## RAG evaluation (CI subset)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat evaluation/results/ci/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the answers and scores
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/ci/
          if-no-files-found: ignore